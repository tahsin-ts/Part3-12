[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "threed"
version = "1.0.0"
description = "3D parallelism from scratch on CPU processes (tensor x pipeline x data) and a 70B training planner"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = {text = "MIT"}

[project.optional-dependencies]
test = ["pytest>=7"]
docs = ["matplotlib>=3.7"]

[project.scripts]
threed = "threed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
