# Two CPU-only Jobs: the 3D-parallel lab (8 worker processes in one pod) and the 70B planner.
apiVersion: batch/v1
kind: Job
metadata:
  name: threed-train-2x2x2
  labels: {app: threed}
spec:
  backoffLimit: 2                 # the in-process launcher already restarts from checkpoints
  template:
    metadata:
      labels: {app: threed}
    spec:
      restartPolicy: Never
      containers:
        - name: threed
          image: threed:latest
          args: ["train", "--grid", "2x2x2", "--steps", "12"]
          resources:
            requests: {cpu: "2", memory: 1Gi}
            limits: {cpu: "2", memory: 2Gi}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: threed-plan-70b
  labels: {app: threed}
spec:
  template:
    metadata:
      labels: {app: threed}
    spec:
      restartPolicy: Never
      containers:
        - name: threed
          image: threed:latest
          args: ["plan", "--hw", "h100", "--gpus", "64", "128", "256", "512", "1024", "--explain", "1024"]
          resources:
            requests: {cpu: "250m", memory: 256Mi}
