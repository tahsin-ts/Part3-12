# Verify and garbage-collect a shared checkpoint volume every hour.
# Training pods write to the same PVC; gc never touches the newest steps or in-flight saves.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ackpt-verify-gc
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: verify-gc
              image: ghcr.io/tahsin-ts/ackpt:0.1.0
              command: ["sh", "-c", "ackpt verify /ckpt; ackpt gc /ckpt --keep 3"]
              resources:
                requests: {cpu: "250m", memory: "512Mi"}
                limits: {cpu: "1", memory: "2Gi"}
              volumeMounts:
                - {name: ckpt, mountPath: /ckpt}
          volumes:
            - name: ckpt
              persistentVolumeClaim:
                claimName: training-checkpoints
