[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ptuner"
version = "1.0.0"
description = "Automatic parallelism configuration tuner for transformer training (DP x TP x PP x ZeRO)"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.5"]

[project.scripts]
ptuner = "ptuner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
