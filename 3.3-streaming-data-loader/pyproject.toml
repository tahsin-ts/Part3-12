[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "streamload"
version = "0.1.0"
description = "High-throughput streaming data loader: shards, range reads, decode workers, exact resume"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = {text = "MIT"}

[project.optional-dependencies]
jpeg = ["pillow>=9"]
test = ["pytest>=7", "pillow>=9"]

[project.scripts]
streamload = "streamload.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
