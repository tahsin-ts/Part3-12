name: 3.3-streaming-data-loader

on:
  push:
    paths: ['3.3-streaming-data-loader/**', '.github/workflows/3.3-streaming-data-loader.yml']
  pull_request:
    paths: ['3.3-streaming-data-loader/**', '.github/workflows/3.3-streaming-data-loader.yml']

defaults:
  run:
    working-directory: 3.3-streaming-data-loader

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install numpy pillow pytest
      - run: make test
      - run: make demo
      - run: make starve

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t streamload:ci .
      - run: docker run --rm --entrypoint sh streamload:ci -c "streamload make-data /data/ds --records 400 && streamload verify /data/ds && streamload resume-check /data/ds --stop-at 3"
